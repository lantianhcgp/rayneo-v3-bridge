name: build
on: push
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - id: ks
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1
      - if: steps.ks.outputs.cache-hit != 'true'
        run: keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: build
        run: gradle assembleDebug --parallel --build-cache --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rayneo-bridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: publish release apk
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VER" ]; then echo "::error::versionName 未找到"; exit 1; fi
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          if [ -z "$APK" ]; then echo "::error::APK 未找到"; exit 1; fi
          ASSET="rayneo-bridge-v${VER}.apk"
          TAG="v${VER}"
          cp "$APK" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "$TAG" --generate-notes
          fi

  emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - id: ks
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1
      - if: steps.ks.outputs.cache-hit != 'true'
        run: keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: build
        run: gradle assembleDebug --no-daemon
      - name: enable kvm
        run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules && sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.rayneo.bridge/.MainActivity
            sleep 6
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then adb logcat -d | grep -A5 "FATAL EXCEPTION"; exit 1; fi
            adb logcat -d | grep -E "I/App|I/Mcp" | tail -8
            adb shell ss -ltn | grep 8766 || echo "WARN: 8766 not listening"
            adb forward tcp:8766 tcp:8766
            for i in 1 2 3; do curl -sf -m 5 -X POST http://127.0.0.1:8766/mcp -H "Content-Type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}" > /tmp/mcp.json && break || sleep 3; done
            grep -q "tools" /tmp/mcp.json || { echo "::error::MCP tools/list 未就绪"; cat /tmp/mcp.json 2>/dev/null; exit 1; }
            echo "模拟器冒烟通过：无崩溃 + MCP tools/list 正常"
